[project]
name = "rebalancer"
version = "0.1.0"
description = "Single-user, paper-locked natural-language portfolio rebalancer (v1) backend."
readme = "README.md"
authors = [
    { name = "Ahmed Rather", email = "ahmedrather.s@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44.0",
    "anthropic>=1.4.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
rebalancer = "rebalancer:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
e2e = [
    "pytest-playwright>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Fast tier by default (D29/H-1): the parser-quality eval (H-3) and browser e2e (H-4) are
# marked and excluded here. Run them explicitly, e.g. `uv run pytest -m eval`.
addopts = ["-m", "not eval and not e2e"]
markers = [
    "eval: semantic parser-quality golden set, hits the real LLM (H-3); opt-in",
    "e2e: full-stack browser tests against the paper account (H-4); opt-in",
]
